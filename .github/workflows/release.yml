name: Publish Extension
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing extension tag to publish or retry
        required: true
        type: string
      marketplace_only:
        description: Retry VS Code Marketplace using the VSIX already on the GitHub release
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: extension-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate tag, version, publisher, and release notes
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/check-release.mjs

  # Both tag pushes and manual retries build the explicitly selected tag.
  package:
    if: ${{ !inputs.marketplace_only }}
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}

  github-release:
    environment: release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: extension-vsix
      - name: Extract extension release notes
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/check-release.mjs > release-notes.md
      - name: Read packaged release channel
        id: channel
        run: echo "channel=$(node scripts/release-channel.mjs fscript-$(node -p 'require("./package.json").version').vsix)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          body_path: release-notes.md
          files: '*.vsix'
          prerelease: ${{ steps.channel.outputs.channel == 'next' }}
          make_latest: ${{ steps.channel.outputs.channel != 'next' }}

  marketplace:
    environment: release
    needs: [validate, github-release]
    if: >-
      ${{ !cancelled() && needs.validate.result == 'success' &&
          (needs.github-release.result == 'success' ||
           (inputs.marketplace_only && needs.github-release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.marketplace_only }}
        with:
          name: extension-vsix
      - name: Download the published VSIX
        if: inputs.marketplace_only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release download "$RELEASE_TAG" --pattern "fscript-${RELEASE_TAG#v}.vsix"
      - run: npm run publish:marketplace

  open-vsx:
    environment: release
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: extension-vsix
      - run: npm run publish:open-vsx
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
